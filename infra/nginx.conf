# =====================================================================
# infra/nginx.conf — addbal 게이트웨이 (Kong 대체, ~10MB)
#
# 두 가지를 한 도메인에서 서빙한다:
#   1) 정적 사이트 (login.html, js/, css/, admin/ ...)  ->  /
#   2) 백엔드 API 3경로                                  ->  /rest|auth|storage/v1/
# 같은 오리진이 되므로 프론트가 CORS 를 아예 안 탄다. (다른 도메인에
# 프론트를 또 올릴 수도 있어서 CORS 헤더는 그대로 둔다.)
#
# proxy_pass 는 반드시 "정적 URI + 끝 슬래시" 형태로 쓴다.
#   O  proxy_pass http://addbal-storage:5000/;
#   X  set $u http://...; proxy_pass $u;
# 변수를 쓰면 nginx 가 이미 디코드된 $uri 를 최소 이스케이프로 다시 붙여서
# 업로드 경로가 깨진다. 파일명은 사용자 입력(공백·괄호)이라 실제로 터진다.
# 대신 정적 형태는 시작 시 1회 DNS 해석이라, 업스트림 컨테이너를 재시작하면
# 게이트웨이도 같이 재시작해야 한다 (docker compose restart 로 통째로).
# =====================================================================
server {
  listen 80;
  server_name _;

  root /srv/site;
  index login.html;

  # 과제 첨부 업로드. storage-api 의 FILE_SIZE_LIMIT(50MB) 과 맞춘다.
  client_max_body_size 50m;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection        "";
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  # ── CORS ──────────────────────────────────────────────────────────
  # 업스트림 3종이 각자 CORS 헤더를 붙이는데 우리가 하나 더 붙이면 브라우저가
  # "multiple values" 로 전부 거부한다. 업스트림 것을 지우고 한 벌만 내보낸다.
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_hide_header Access-Control-Expose-Headers;
  proxy_hide_header Access-Control-Allow-Credentials;
  proxy_hide_header Access-Control-Max-Age;

  add_header Access-Control-Allow-Origin  "*" always;
  add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, HEAD, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Authorization, apikey, Content-Type, X-Client-Info, X-Supabase-Api-Version, Prefer, Accept-Profile, Content-Profile, Range, X-Upsert, Cache-Control, X-Requested-With" always;
  # Content-Range 를 노출하지 않으면 supabase-js 의 count 옵션이 조용히 null 이 된다
  add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Content-Type, ETag, Location, X-Upsert" always;

  # ── API 3경로 ─────────────────────────────────────────────────────
  # ^~ 를 쓴다: 정규식 location(아래 차단 규칙)보다 먼저 확정시키기 위함.
  # 그냥 prefix 로 두면 "과제.md" 같은 첨부 업로드 경로가 확장자 차단 규칙에
  # 걸려 404 가 된다.
  location ^~ /rest/v1/ {
    if ($request_method = OPTIONS) { return 204; }
    proxy_pass http://addbal-rest:3000/;
  }

  location ^~ /auth/v1/ {
    if ($request_method = OPTIONS) { return 204; }
    proxy_pass http://addbal-auth:9999/;
  }

  location ^~ /storage/v1/ {
    if ($request_method = OPTIONS) { return 204; }
    # 업로드/다운로드는 스트리밍으로 흘린다 (메모리 통째 버퍼링 방지)
    proxy_request_buffering off;
    proxy_buffering         off;
    proxy_pass http://addbal-storage:5000/;
  }

  location = /health {
    access_log off;
    default_type text/plain;      # 없으면 octet-stream 이라 브라우저가 다운로드한다
    return 200 "addbal-gw ok\n";
  }

  # ── 공개 금지 ─────────────────────────────────────────────────────
  # 레포 전체를 마운트하므로 여기서 막는다. infra/.env 에는 RLS 를 우회하는
  # service_role 키가 있어서 한 번 새면 전량 유출이다.
  location ~ ^/(infra|supabase)(/|$) { return 404; }
  location ~ /\.                     { return 404; }   # .env .git .gitignore …
  location ~ \.(ps1|sh|sql|mjs|ya?ml|md|bak|log)$ { return 404; }

  # ── 정적 사이트 ───────────────────────────────────────────────────
  location / {
    try_files $uri $uri/ =404;
  }
}
