<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 재설정 · 스파미의 쇼피파이 챌린지</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth">
  <form class="auth-card" id="resetForm">
    <div class="auth-brand">
      <h1>비밀번호 재설정</h1>
      <p>새 비밀번호를 입력하세요</p>
    </div>

    <div class="auth-msg" id="msg">확인 중...</div>

    <div id="fields" hidden>
      <div class="field">
        <label for="pw1">새 비밀번호</label>
        <input type="password" id="pw1" autocomplete="new-password" placeholder="8자 이상">
      </div>
      <div class="field">
        <label for="pw2">새 비밀번호 확인</label>
        <input type="password" id="pw2" autocomplete="new-password" placeholder="한 번 더 입력">
      </div>
      <button class="auth-btn" type="submit" id="submitBtn">비밀번호 변경</button>
    </div>

    <div class="auth-alt" id="alt">
      <a href="login.html">로그인으로 돌아가기</a>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/util.js"></script>
<script>
(function () {
  // 재설정 메일의 링크로 들어오는 페이지.
  // Supabase 가 링크의 토큰을 URL(#access_token…&type=recovery)로 넘겨주고, 클라이언트가 페이지 로드 때 이를 읽어
  // '복구 세션'을 만든다. 그 세션으로 updateUser({password}) 를 호출하면 비밀번호가 바뀐다.
  // Auth.require() 는 일부러 쓰지 않는다 — 세션이 없을 때 login 으로 튕겨 '링크 만료' 안내를 못 보여주기 때문.
  var msg = document.getElementById('msg');
  var fields = document.getElementById('fields');
  var form = document.getElementById('resetForm');
  var btn = document.getElementById('submitBtn');
  var alt = document.getElementById('alt');
  var ready = false;

  function show(text) { msg.textContent = text; }

  function enable() {
    if (ready) return;
    ready = true;
    fields.hidden = false;
    show('새 비밀번호를 입력하고 [비밀번호 변경]을 누르세요.');
    document.getElementById('pw1').focus();
  }
  function expired(reason) {
    fields.hidden = true;
    show(reason || '링크가 만료됐거나 이미 사용됐습니다. 아래에서 재설정 메일을 다시 받으세요.');
    alt.innerHTML = '<a href="login.html#reset">재설정 메일 다시 받기</a> · <a href="login.html">로그인</a>';
  }

  // 링크 자체가 오류를 들고 오는 경우 (만료 등): #error=…&error_description=…
  var hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (hash.get('error')) {
    expired(/expired/i.test(hash.get('error_description') || '') ? '링크가 만료됐습니다. 아래에서 재설정 메일을 다시 받으세요.' : null);
  }

  // 복구 세션 감지: 이벤트 + 직접 조회 두 가지로 (초기화 타이밍에 따라 둘 중 하나만 걸릴 수 있음)
  sb.auth.onAuthStateChange(function (event, session) {
    if ((event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') && session) enable();
  });
  (async function () {
    var res = await sb.auth.getSession();
    if (res.data && res.data.session) enable();
    else if (!hash.get('error')) setTimeout(function () { if (!ready) expired(); }, 1500);   // 이벤트가 늦게 올 여지를 잠깐 둠
  })();

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!ready) return;
    var p1 = document.getElementById('pw1').value;
    var p2 = document.getElementById('pw2').value;
    if (p1.length < 8) return show('비밀번호는 8자 이상이어야 합니다.');
    if (p1 !== p2) return show('두 비밀번호가 서로 다릅니다.');

    btn.disabled = true;
    show('변경 중...');
    var res = await sb.auth.updateUser({ password: p1 });
    if (res.error) {
      btn.disabled = false;
      var m = res.error.message || '';
      if (/different from the old/i.test(m)) return show('이전과 같은 비밀번호는 쓸 수 없습니다. 다른 비밀번호를 입력하세요.');
      if (/expired|invalid|session/i.test(m)) return expired();
      return show('변경 실패: ' + m);
    }
    // 메일 링크로 만든 세션은 여기서 끝내고, 새 비밀번호로 정식 로그인하게 한다 (공용 PC 에 세션이 남지 않도록)
    await sb.auth.signOut();
    fields.hidden = true;
    show('비밀번호가 변경됐습니다. 잠시 후 로그인 화면으로 이동합니다.');
    setTimeout(function () { location.href = 'login.html'; }, 1500);
  });
})();
</script>
</body>
</html>
