<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마케팅 핵심 용어 사전</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root {
    --blue: #2f6bff; --blue-soft: #eef3ff; --ink: #1a1f2b; --muted: #6b7280;
    --line: #e6e9f0; --card: #ffffff; --bg: #f4f6fb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
    color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; line-height: 1.5; word-break: keep-all; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 34px 26px 60px; }

  /* 헤더 */
  .gl-title { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
  .gl-title b { color: var(--blue); font-weight: 800; }
  .gl-rule { height: 4px; width: 100%; background: var(--blue); border-radius: 3px; margin: 14px 0 18px; }
  .gl-intro { background: var(--blue-soft); border: 1px solid #d6e2ff; border-radius: 12px;
    padding: 13px 16px; font-size: 0.9rem; color: #33456b; line-height: 1.6; }
  .gl-intro .n { color: var(--blue); font-weight: 800; }

  /* 카드 그리드 */
  .gl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 22px; }
  .card { position: relative; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 20px 20px 18px; box-shadow: 0 1px 2px rgba(20,30,60,.04); }
  .card.is-metric { border-color: #cfdcff; }
  .card__badge { position: absolute; top: -12px; left: 18px; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.95rem;
    color: #fff; background: var(--blue); box-shadow: 0 3px 8px rgba(47,107,255,.35); }
  .card__badge--concept { background: #fff; color: #c2c8d4; border: 1.5px solid #dfe3ec; box-shadow: none; font-size: 1.1rem; }
  .card__term { font-size: 1.35rem; font-weight: 800; margin: 6px 0 2px; letter-spacing: -0.01em; }
  .card__en { font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 12px; }
  .card__def { font-size: 0.92rem; color: #364152; line-height: 1.65; }

  /* 대시보드 위치 안내 */
  .gl-map { margin-top: 40px; }
  .gl-map__label { font-size: 1.05rem; font-weight: 800; margin: 0 0 4px; }
  .gl-map__sub { font-size: 0.85rem; color: var(--muted); margin: 0 0 16px; }
  .shot { margin: 12px 0 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    background: #fff; box-shadow: 0 1px 2px rgba(20,30,60,.04); }
  .shot img { display: block; width: 100%; height: auto; }
  .pin { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px;
    border-radius: 50%; background: var(--blue); color: #fff; font-size: 0.72rem; font-weight: 800;
    margin-right: 6px; vertical-align: middle; }
  .gl-foot { text-align: center; color: #aab0bb; font-size: 0.76rem; margin-top: 36px; }

  @media (max-width: 780px) { .gl-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .gl-grid { grid-template-columns: 1fr; } .wrap { padding: 26px 16px 44px; } }
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="gl-title" id="glTitle">마케팅 핵심 <b>용어 사전</b></h1>
    <div class="gl-rule"></div>
    <div class="gl-intro" id="glIntro"></div>

    <div class="gl-grid" id="glGrid"></div>

    <div class="gl-map">
      <div class="gl-map__label">캠페인 대시보드 — <span class="pin">2</span> AOV 표시 위치</div>
      <p class="gl-map__sub">캠페인을 열면 보이는 성과 대시보드입니다. 평균 주문 금액(AOV)이 상단에 표시됩니다.</p>
      <figure class="shot"><img src="images/glossary/dashboard.png" alt="캠페인 대시보드 — 평균 주문 금액(AOV) 표시 위치"></figure>

      <div class="gl-map__label" style="margin-top:34px;">30일 성과 지표 바 — <span class="pin">1</span> CAC · <span class="pin">2</span> AOV · <span class="pin">3</span> ROAS 표시 위치</div>
      <p class="gl-map__sub">광고 설정 화면 상단의 성과 바입니다. (한 줄 이미지를 두 줄로 나눠 표시)</p>
      <figure class="shot"><img src="images/glossary/bar-top.png" alt="30일 성과 바 윗줄 — 고객 수 · AOV · 매출"></figure>
      <figure class="shot" style="margin-top:10px;"><img src="images/glossary/bar-bottom.png" alt="30일 성과 바 아랫줄 — 광고비 · CAC · ROAS"></figure>
    </div>

    <div class="gl-foot">광고 설정 연습용 용어사전 · 챌린지 매뉴얼과 별도로 관리됩니다</div>
  </div>

<script src="js/ad-glossary-data.js"></script>
<script>
(function () {
  var G = window.AD_GLOSSARY || { terms: [] };
  var CIRCLED = { 1: '①', 2: '②', 3: '③' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  if (G.title) { document.title = G.title; }
  document.getElementById('glIntro').innerHTML =
    (G.intro || '').replace(/[①②③]/g, function (m) { return '<span class="n">' + m + '</span>'; });

  document.getElementById('glGrid').innerHTML = (G.terms || []).filter(function (t) {
    return !t.tipOnly;   // 툴팁 전용 용어는 카드에 넣지 않음
  }).map(function (t) {
    var badge = t.badge
      ? '<span class="card__badge">' + t.badge + '</span>'
      : '<span class="card__badge card__badge--concept">–</span>';
    return '<div class="card' + (t.badge ? ' is-metric' : '') + '">' +
      badge +
      '<div class="card__term">' + esc(t.term) + '</div>' +
      '<div class="card__en">' + esc(t.en || '') + '</div>' +
      '<div class="card__def">' + esc(t.full || t.short || '') + '</div>' +
    '</div>';
  }).join('');
})();
</script>
</body>
</html>
