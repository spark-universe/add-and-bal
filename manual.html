<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>shopify 챌린지</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="css/manual.css">
</head>
<body class="manual-page">
<div class="manual-doc">

<button class="menu-toggle" onclick="document.body.classList.toggle('nav-open')">☰ 목차</button>
<div class="backdrop" onclick="document.body.classList.remove('nav-open')"></div>
<div class="mn-layout">
  <aside class="mn-sidebar">
    <div class="brand">
      <div class="logo">shopify 챌린지</div>
    </div>
    <div class="mn-search">
      <input type="text" id="mnQuery" placeholder="검색어를 입력하세요">
      <select id="mnScope" title="검색 범위">
        <option value="title">제목</option>
        <option value="body">본문 내용</option>
        <option value="both" selected>제목 + 본문</option>
      </select>
    </div>
    <nav id="nav"></nav>
    <div class="mn-foot">
      <a class="mn-foot__link" href="challenge.html">← 훈련 화면으로 돌아가기</a>
      <a class="mn-foot__logout" href="#">로그아웃</a>
    </div>
  </aside>
  <main class="main">
    <div class="mn-topbar">
      <a class="mn-submit" href="challenge.html">📝 과제 제출하기</a>
    </div>
    <div id="manualBody"></div>
    <div class="mn-chapnav" id="chapNav" hidden>
      <button class="mn-chapbtn" id="prevBtn">← 이전 내용 보기</button>
      <button class="mn-chapbtn is-next" id="nextBtn">다음 챌린지 내용 보기 →</button>
    </div>
    <div class="footer">SHOPIFY 실무 교재 &nbsp;|&nbsp; 준비 중 챕터는 자료 업데이트 후 채워집니다.</div>
  </main>
</div>
<button class="mn-scrolltop" id="scrollTop" title="맨 위로" hidden>↑</button>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script>Auth.require();</script>
<script>
// 매뉴얼: DB에서 목차/본문을 그려 챕터별 단일 보기. 공개는 서버시간(한국) 기준.
(async function boot() {
  await renderManual();
  var ctx = await loadStatus();   // 서버시간 + 공개/과제 상태
  applyStatus(ctx);               // 뱃지 + 미공개 본문 잠금 (표시 전에 처리)
  initSearch();
  initSingle();
  var doc = document.querySelector('.manual-doc');
  if (doc) doc.classList.add('ready');
})();

var CH = [];   // 렌더된 챕터 [{slug,title,bodyText}] — 검색용

function mesc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

async function renderManual() {
  try {
    var res = await sb.from('manual_chapters').select('slug,num,title,part,sort,soon,body').order('sort', { ascending: true });
    var chapters = (res && res.data) || [];
    var nav = '', body = '', lastPart = null, tmp = document.createElement('div');
    chapters.forEach(function (c) {
      if (c.part && c.part !== lastPart) { nav += '<div class="nav-part">' + mesc(c.part) + '</div>'; lastPart = c.part; }
      nav += '<a class="nav-item' + (c.soon ? ' soon' : '') + '" href="#' + mesc(c.slug) + '">' +
        '<span class="nav-num">' + mesc(c.num || '') + '</span><span class="nav-txt">' + mesc(c.title || '') + '</span>' +
        (c.soon ? '<span class="nav-badge">준비중</span>' : '') + '</a>';
      body += '<section class="doc-section" id="' + mesc(c.slug) + '">' +
        '<div class="sec-head"><span class="sec-num">' + mesc(c.num || '') + '</span><h2 class="sec-title">' + mesc(c.title || '') + '</h2></div>' +
        (c.body || '') + '</section>';
      tmp.innerHTML = c.body || '';
      CH.push({ slug: c.slug, title: (c.title || '').toLowerCase(), bodyText: (tmp.textContent || '').toLowerCase() });
    });
    // 맨 앞에 '챌린지 소개' 화면 (진입 시 제일 먼저 보임)
    var introNav = '<a class="nav-item nav-intro" href="#intro"><span class="nav-txt">🎯 챌린지 소개</span></a>';
    var introSec =
      '<section class="doc-section" id="intro"><div class="mn-intro">' +
        '<div class="mn-intro__eyebrow">SHOPIFY 챌린지</div>' +
        '<h1 class="mn-intro__title">쇼피파이 스토어, 직접 만들며 배우는 챌린지</h1>' +
        '<p class="mn-intro__lead">쇼피파이로 미국 판매용 스토어를 처음부터 끝까지 직접 만들어 보는 실습 과정입니다. ' +
          '수강생 누구나 어렵지 않게 따라 할 수 있도록, 실제 화면을 그대로 보면서 단계별로 진행하도록 만들었습니다.</p>' +
        '<div class="mn-intro__how">' +
          '<div class="mn-intro__card"><b>1. 목차에서 선택</b><span>왼쪽 목차에서 보고 싶은 챕터를 눌러요.</span></div>' +
          '<div class="mn-intro__card"><b>2. 따라 하기</b><span>화면 캡처를 순서대로 따라 하면 됩니다.</span></div>' +
          '<div class="mn-intro__card"><b>3. 과제 제출</b><span>챕터를 익힌 뒤 상단 “과제 제출하기”로 제출해요.</span></div>' +
        '</div>' +
        '<button class="mn-intro__start" id="introStart">첫 챕터 시작하기 →</button>' +
      '</div></section>';

    document.getElementById('nav').innerHTML = introNav + nav;
    document.getElementById('manualBody').innerHTML = introSec + body;
  } catch (e) {}
}

// 서버 시간 — 로컬 시계가 아니라 서버(Postgres now())를 기준으로 공개 여부를 판단
async function getServerNow() {
  try {
    var r = await sb.rpc('server_now');
    if (r && r.data) { var t = Date.parse(r.data); if (!isNaN(t)) return t; }
  } catch (e) {}
  return Date.now();   // 폴백
}
function fmtKST(v) {
  var t = (typeof v === 'number') ? v : Date.parse(v);
  if (isNaN(t)) return '';
  try {
    return new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(t));
  } catch (e) { return new Date(t).toLocaleString('ko-KR'); }
}

// 공개/과제 상태 로드
async function loadStatus() {
  var ctx = { now: await getServerNow(), isAdmin: false, pub: {}, hw: {}, submitted: {} };
  try {
    var ses = await sb.auth.getSession();
    if (!ses.data.session) return ctx;
    var uid = ses.data.session.user.id;
    var prof = await sb.from('profiles').select('role, cohort').eq('id', uid).single();
    var p = (prof && prof.data) || {};
    var preview = new URLSearchParams(location.search).get('cohort');
    ctx.isAdmin = (p.role === 'admin' && !preview);
    var cohort = (p.role === 'admin' && preview) ? Number(preview) : (p.cohort || 1);
    var cm = await sb.from('cohort_manual').select('slug,status,publish_at').eq('cohort', cohort);
    (cm.data || []).forEach(function (r) { ctx.pub[r.slug] = { status: r.status, publish_at: r.publish_at }; });
    if (!ctx.isAdmin) {
      var ch = await sb.from('challenges').select('id, manual_slug, open_at').eq('cohort', cohort).eq('active', true);
      (ch.data || []).forEach(function (c) { if (!c.manual_slug) return; (ctx.hw[c.manual_slug] = ctx.hw[c.manual_slug] || []).push(c); });
      var su = await sb.from('challenge_submissions').select('challenge_id').eq('user_id', uid);
      (su.data || []).forEach(function (s) { ctx.submitted[s.challenge_id] = true; });
    }
  } catch (e) {}
  return ctx;
}

function isPublished(slug, ctx) {
  var pi = ctx.pub[slug];
  if (!pi) return true;                                  // 설정 없으면 기본 공개
  if (pi.status === 'public') return true;
  if (pi.status === 'scheduled' && pi.publish_at && Date.parse(pi.publish_at) <= ctx.now) return true;
  return false;
}
function setBadge(nav, text, kind) {
  if (!nav) return;
  var b = nav.querySelector('.nav-badge'); if (b) b.remove();
  nav.insertAdjacentHTML('beforeend', '<span class="nav-badge nav-badge--' + kind + '">' + text + '</span>');
}

// 미공개는 숨기지 않고 '공개 예정'으로 보여주고, 클릭 시 공개 예정 안내. 공개된 건 과제 상태.
function applyStatus(ctx) {
  if (ctx.isAdmin) return;   // 어드민(미리보기 아님): 전부 공개, 뱃지 없음
  CH.forEach(function (c) {
    var nav = document.querySelector('.nav-item[href="#' + c.slug + '"]');
    var sec = document.getElementById(c.slug);
    if (!isPublished(c.slug, ctx)) {
      setBadge(nav, '공개 예정', 'soon');
      if (nav) nav.classList.add('soon');
      if (sec) {
        var pi = ctx.pub[c.slug];
        var msg = (pi && pi.status === 'scheduled' && pi.publish_at)
          ? '🔒 이 챌린지는 <b>' + fmtKST(pi.publish_at) + '</b>에 공개될 예정입니다.'
          : '🔒 이 챌린지는 향후 공개될 예정입니다.';
        var head = sec.querySelector('.sec-head'); sec.innerHTML = ''; if (head) sec.appendChild(head);
        var box = document.createElement('div'); box.className = 'soon-box'; box.innerHTML = msg; sec.appendChild(box);
      }
      return;
    }
    // 공개됨 → 연결된 과제(열린 것만) 제출 여부
    var hws = (ctx.hw[c.slug] || []).filter(function (h) { return !h.open_at || Date.parse(h.open_at) <= ctx.now; });
    if (hws.length) {
      var allDone = hws.every(function (h) { return ctx.submitted[h.id]; });
      setBadge(nav, allDone ? '과제 제출 완료' : '과제 제출 미완료', allDone ? 'done' : 'todo');
    }
  });
}

// 목차 검색 (제목 / 본문 / 제목+본문)
function initSearch() {
  var q = document.getElementById('mnQuery'), scope = document.getElementById('mnScope');
  if (!q || !scope) return;
  var navEl = document.getElementById('nav');
  var map = {}; CH.forEach(function (c) { map[c.slug] = c; });
  function run() {
    var term = (q.value || '').trim().toLowerCase(), mode = scope.value;
    navEl.querySelectorAll('.nav-item').forEach(function (n) {
      if (!term) { n.classList.remove('search-off'); return; }
      var c = map[n.getAttribute('href').slice(1)] || {};
      var t = c.title || '', b = c.bodyText || '';
      var hit = mode === 'title' ? t.indexOf(term) !== -1 : mode === 'body' ? b.indexOf(term) !== -1 : (t.indexOf(term) !== -1 || b.indexOf(term) !== -1);
      n.classList.toggle('search-off', !hit);
    });
    navEl.querySelectorAll('.nav-part').forEach(function (pl) {
      if (!term) { pl.classList.remove('search-off'); return; }
      var any = false, el = pl.nextElementSibling;
      while (el && !el.classList.contains('nav-part')) { if (el.classList.contains('nav-item') && !el.classList.contains('search-off')) { any = true; break; } el = el.nextElementSibling; }
      pl.classList.toggle('search-off', !any);
    });
  }
  q.addEventListener('input', run);
  scope.addEventListener('change', run);
}

// 챕터 단일 보기 + 이전/다음 이동 + 맨 위로
function initSingle() {
  var order = [].slice.call(document.querySelectorAll('.nav-item'))
    .map(function (n) { return n.getAttribute('href').slice(1); });

  var chapNav = document.getElementById('chapNav');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');

  if (!order.length) {
    var mb = document.getElementById('manualBody');
    if (mb) mb.innerHTML = '<div style="min-height:60vh;display:flex;align-items:center;justify-content:center;padding:40px;">' +
      '<div style="text-align:center;max-width:440px;"><div style="font-size:46px;margin-bottom:14px;">📘</div>' +
      '<div style="color:#6b7280;font-size:1rem;line-height:1.65;">이 매뉴얼은 아직 공개 전입니다. 곧 공개될 예정이에요.</div></div></div>';
    if (chapNav) chapNav.hidden = true;
    return;
  }

  function current() { var s = (location.hash || '').slice(1); return order.indexOf(s) !== -1 ? s : order[0]; }
  function show(slug) {
    if (order.indexOf(slug) === -1) slug = order[0];
    document.querySelectorAll('.doc-section').forEach(function (s) { s.classList.remove('is-current'); });
    var sec = document.getElementById(slug); if (sec) sec.classList.add('is-current');
    document.querySelectorAll('.nav-item').forEach(function (n) { n.classList.remove('active'); });
    var nav = document.querySelector('.nav-item[href="#' + slug + '"]'); if (nav) nav.classList.add('active');
    var i = order.indexOf(slug);
    prevBtn.style.visibility = i <= 0 ? 'hidden' : 'visible';
    nextBtn.style.visibility = i >= order.length - 1 ? 'hidden' : 'visible';
    chapNav.hidden = false;
    if (('#' + slug) !== location.hash) history.replaceState(null, '', '#' + slug);
    document.body.classList.remove('nav-open');
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  document.getElementById('nav').addEventListener('click', function (e) {
    var a = e.target.closest('.nav-item'); if (!a) return;
    e.preventDefault(); show(a.getAttribute('href').slice(1));
  });
  prevBtn.addEventListener('click', function () { var i = order.indexOf(current()); if (i > 0) show(order[i - 1]); });
  nextBtn.addEventListener('click', function () { var i = order.indexOf(current()); if (i < order.length - 1) show(order[i + 1]); });
  window.addEventListener('hashchange', function () { show(current()); });

  // 챌린지 소개의 '첫 챕터 시작하기' → 첫 실제 챕터로
  var startBtn = document.getElementById('introStart');
  if (startBtn) startBtn.addEventListener('click', function () { if (order.length > 1) show(order[1]); });

  // 맨 위로 버튼
  var top = document.getElementById('scrollTop');
  if (top) {
    var onScroll = function () { top.hidden = window.scrollY < 240; };
    window.addEventListener('scroll', onScroll); onScroll();
    top.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  }

  show(current());
}
</script>

</body>
</html>
