<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 · 스파미의 쇼피파이 챌린지</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth">
  <form class="auth-card" id="loginForm">
    <div class="auth-brand">
      <h1>스파미의 쇼피파이 챌린지</h1>
      <p>로그인 후 훈련을 시작하세요</p>
    </div>

    <div class="auth-msg" id="msg"></div>

    <div class="field">
      <label for="email">이메일</label>
      <input type="email" id="email" autocomplete="username" placeholder="가입한 구글 이메일">
    </div>

    <div class="field">
      <label for="password">비밀번호</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요">
    </div>

    <button class="auth-btn" type="submit" id="submitBtn">로그인</button>

    <div class="auth-alt">
      아직 회원이 아니신가요? <a href="signup.html">회원가입</a><br>
      <a href="#reset" id="forgotLink">비밀번호를 잊으셨나요?</a>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/util.js"></script>
<script>
(function () {
  var form = document.getElementById('loginForm');
  var msg = document.getElementById('msg');
  var btn = document.getElementById('submitBtn');

  function show(text) { msg.textContent = text; msg.className = 'auth-msg'; }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    var pw = document.getElementById('password').value;

    if (!email || !pw) { return show('이메일과 비밀번호를 모두 입력하세요.'); }

    btn.disabled = true;
    show('로그인 중...');

    var res = await sb.auth.signInWithPassword({ email: email, password: pw });
    if (res.error) {
      btn.disabled = false;
      var m = res.error.message || '';
      if (/email not confirmed/i.test(m)) return show('이메일 인증이 완료되지 않았습니다. 가입 때 받은 메일의 인증 링크를 먼저 클릭해 주세요.');
      if (/invalid login credentials/i.test(m)) return show('이메일 또는 비밀번호가 올바르지 않습니다.');
      return show('로그인 실패: ' + m);
    }

    // 프로필로 역할/승인 상태 확인 후 라우팅
    var prof = await sb.from('profiles').select('*').eq('id', res.data.user.id).single();
    btn.disabled = false;

    if (prof.error) { return show('프로필 조회 실패: ' + prof.error.message); }

    if (prof.data.role === 'admin') {
      window.location.href = 'admin/index.html';
    } else if (prof.data.is_demo) {              // 공용 데모(테스트) 계정 → 광고 설정만
      window.location.href = 'ad-settings.html';
    } else if (prof.data.status === 'approved') {
      window.location.href = 'index.html';
    } else {
      await sb.auth.signOut();
      show('아직 관리자 승인 대기 중입니다. 승인 후 이용할 수 있습니다.');
    }
  });

  // ----- 비밀번호 재설정 메일 요청 -----
  // 이메일 칸에 적힌 주소로 재설정 메일을 보낸다. 링크를 누르면 reset-password.html 로 돌아와 새 비밀번호를 정한다.
  // (그 주소는 Supabase → Authentication → URL Configuration → Redirect URLs 에 등록돼 있어야 한다)
  var forgot = document.getElementById('forgotLink');
  var emailEl = document.getElementById('email');
  var sending = false;
  forgot.addEventListener('click', async function (e) {
    e.preventDefault();
    if (sending) return;
    var email = emailEl.value.trim();
    if (!email) { emailEl.focus(); return show('가입한 이메일을 먼저 입력한 뒤 다시 눌러주세요.'); }
    sending = true;
    show('재설정 메일을 보내는 중...');
    var res = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/reset-password.html' });
    sending = false;
    if (res.error) {
      var m = res.error.message || '';
      if (/rate limit|too many/i.test(m)) return show('요청이 너무 잦습니다. 잠시 후 다시 시도하세요.');
      return show('메일 발송 실패: ' + m);
    }
    // 존재하지 않는 이메일이어도 같은 문구 (계정 존재 여부를 노출하지 않음)
    show('재설정 메일을 보냈습니다. 메일의 링크를 열어 새 비밀번호를 설정하세요. (스팸함도 확인)');
  });
  // reset-password.html 의 '다시 받기' 로 돌아온 경우: 안내만 띄우고 이메일 칸에 포커스
  if (location.hash === '#reset') { emailEl.focus(); show('가입한 이메일을 입력한 뒤 아래 "비밀번호를 잊으셨나요?"를 누르세요.'); }
})();
</script>
</body>
</html>
